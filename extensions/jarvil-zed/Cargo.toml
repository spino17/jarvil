[package]
name = "jarvil-zed"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone: Zed extensions build to `wasm32-wasip1` as a cdylib, which does not
# belong in the main workspace alongside native crates.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"
