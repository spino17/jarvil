[package]
name = "compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
rustc-hash = { version = "2.1" }
jarvil-macros = { path = "jarvil-macros" }
text-size = "1.1.1"
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2.0"
owo-colors = "4.4"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps serialized fields in declaration order rather than
# sorting them, so the AST dumps read top-down like the source they came from
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }