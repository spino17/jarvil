[package]
name = "compiler"
version = "0.1.0"
edition = "2018"
authors = ["Bhavya Bhatt bhavyabhatt17@gmail.com"]

[dependencies]
rustc-hash = { version = "1.1" }
colored = "2.0.0"
jarvil-macros = { path = "jarvil-macros" }
text-size = "1.1.0"
miette = { version = "5.3.0", features = ["fancy"] }
thiserror = "1.0.34"
owo-colors = "3.5.0"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps serialized fields in declaration order rather than
# sorting them, so the AST dumps read top-down like the source they came from
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }