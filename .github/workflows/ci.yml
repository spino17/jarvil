# The four checks that should pass before a commit. Documented in README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `anyon run` shells out to python3 for the codegen corpus, which asserts
      # on the generated program's real output rather than only its text.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # Catches intra-doc links that break when an item moves between crates.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
